services:
  postgres:
    image: postgres:16
    container_name: subhakamana-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: subhakamana
      POSTGRES_PASSWORD: change_me_local_only
      POSTGRES_DB: subhakamana_store
    ports:
      - "5432:5432"
    volumes:
      - subhakamana_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subhakamana -d subhakamana_store"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  subhakamana_postgres_data:
